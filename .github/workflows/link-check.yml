name: Link check

on:
  pull_request:
    paths:
      - '**/*.md'

jobs:
  link-check:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run lychee link checker
        uses: lycheeverse/lychee-action@v1
        with:
          # check markdown files only; increase timeout for slow hosts
          args: "--recursive --exclude '*.png' --timeout 15 '**/*.md'"

      - name: Upload lychee report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: lychee-report.json

# Notes:
# - lychee is fast and respects robots; it reports broken links and redirects.
# - If a transient external service causes false positives, maintainers can
#   add specific URLs to a .lychee-ignore file in the repo (checked into main).
